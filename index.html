  </div>

  <svg class="cloud c1" viewBox="0 0 100 50"><path d="M10 44 Q0 30 14 24 Q16 6 36 10 Q48 -2 64 12 Q84 8 86 28 Q100 32 92 44 Z"/></svg>
  <svg class="cloud c2" viewBox="0 0 100 50"><path d="M10 44 Q0 30 14 24 Q16 6 36 10 Q48 -2 64 12 Q84 8 86 28 Q100 32 92 44 Z"/></svg>

  <!-- Beton mikseri (arka şerit, sağa) -->

        <rect x="12" y="70" width="176" height="10" rx="3" fill="#5b6470"/>

        <g class="wheel"><circle cx="72" cy="90" r="13" fill="#2b2b3a"/><circle cx="72" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M72 90 v-5" stroke="#2b2b3a"/></g>
        <g class="wheel"><circle cx="160" cy="90" r="13" fill="#2b2b3a"/><circle cx="160" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M160 90 v-5" stroke="#2b2b3a"/></g>
      </g>
    </svg>
  </div>

  <!-- Ekskavatör (arka şerit, sola) -->
  <div class="veh back rtl digger" style="--dur:58s;--delay:-24s">
    <svg viewBox="0 0 212 110">
      <g class="o">
        <rect x="30" y="82" width="112" height="22" rx="11" fill="#4a4f5c"/>
        <path d="M44 93H128" stroke="#9aa1ad" stroke-width="3" stroke-dasharray="7 7" class="track" fill="none"/>
        <rect x="38" y="60" width="92" height="24" rx="5" fill="#f0b84a"/>
        <path d="M46 60 V36 H84 L98 60 Z" fill="#f0b84a"/>
        <path d="M52 42 H80 L90 56 H52Z" fill="#dff1f2"/>
        <g class="boom">
          <path d="M112 64 L128 56 L172 24 L182 34 L134 70 Z" fill="#f0b84a"/>

            <path d="M166 26 L180 20 L196 58 L186 62 Z" fill="#e6a23a"/>
            <path d="M184 54 L206 50 L206 70 L190 72 Z" fill="#6d7480"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <!-- İtfaiye (ön şerit, sağa) -->
  <div class="veh front fire" style="--dur:30s;--delay:-12s">
    <svg viewBox="0 0 200 110">
      <g class="o">
        <rect x="12" y="72" width="176" height="10" rx="3" fill="#5b6470"/>
        <rect x="12" y="46" width="124" height="34" rx="4" fill="#c8423d"/>
        <rect x="12" y="62" width="124" height="5" fill="#fffaf0"/>
        <path d="M54 48V78M96 48V78" fill="none" stroke-width="1.8"/>
        <rect x="20" y="34" width="104" height="8" rx="2" fill="#e8c27a"/>
        <path d="M32 34v8M44 34v8M56 34v8M68 34v8M80 34v8M92 34v8M104 34v8M116 34v8" fill="none" stroke-width="1.8"/>
        <path d="M138 50 H164 L186 68 V82 H138 Z" fill="#c8423d"/>
        <path d="M146 56 H162 L174 68 H146 Z" fill="#dff1f2"/>
        <rect class="beacon" x="146" y="42" width="14" height="7" rx="2" fill="#ffd84a"/>
        <g class="wheel"><circle cx="38" cy="90" r="13" fill="#2b2b3a"/><circle cx="38" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M38 90 v-5" stroke="#2b2b3a"/></g>
        <g class="wheel"><circle cx="100" cy="90" r="13" fill="#2b2b3a"/><circle cx="100" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M100 90 v-5" stroke="#2b2b3a"/></g>
        <g class="wheel"><circle cx="162" cy="90" r="13" fill="#2b2b3a"/><circle cx="162" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M162 90 v-5" stroke="#2b2b3a"/></g>
      </g>
    </svg>
  </div>

  <!-- Ambulans (ön şerit, sola) -->
  <div class="veh front rtl ambulance" style="--dur:36s;--delay:-3s">
    <svg viewBox="0 0 200 110">
      <g class="o">
        <rect x="12" y="38" width="118" height="44" rx="5" fill="#fffaf0"/>
        <path d="M130 48 H160 L186 68 V82 H130 Z" fill="#fffaf0"/>
        <path d="M138 54 H158 L172 68 H138 Z" fill="#dff1f2"/>
        <rect x="12" y="74" width="118" height="5" fill="#c8423d" stroke="none"/>
        <rect x="66" y="44" width="10" height="26" fill="#c8423d" stroke="none"/>
        <rect x="58" y="52" width="26" height="10" fill="#c8423d" stroke="none"/>
        <rect class="beacon" x="142" y="42" width="14" height="7" rx="2" fill="#ffd84a"/>
        <g class="wheel"><circle cx="44" cy="90" r="13" fill="#2b2b3a"/><circle cx="44" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M44 90 v-5" stroke="#2b2b3a"/></g>
        <g class="wheel"><circle cx="158" cy="90" r="13" fill="#2b2b3a"/><circle cx="158" cy="90" r="5" fill="#cfd6dc" stroke="none"/><path d="M158 90 v-5" stroke="#2b2b3a"/></g>
      </g>
    </svg>
  </div>

  <!-- Küçük araba (ön şerit, sağa) -->
  <div class="veh front car" style="--dur:22s;--delay:-17s">
    <svg viewBox="0 0 170 100">
      <g class="o">
        <path d="M14 82 Q12 64 30 60 Q44 34 82 34 Q120 34 134 60 Q152 62 154 82 Z" fill="#8fc9bf"/>
        <path d="M46 58 Q56 42 80 42 V58 Z M86 42 Q110 42 120 58 H86 Z" fill="#dff1f2"/>
        <circle cx="146" cy="70" r="4" fill="#ffd84a"/>
        <g class="wheel"><circle cx="42" cy="82" r="13" fill="#2b2b3a"/><circle cx="42" cy="82" r="5" fill="#cfd6dc" stroke="none"/><path d="M42 82 v-5" stroke="#2b2b3a"/></g>
        <g class="wheel"><circle cx="122" cy="82" r="13" fill="#2b2b3a"/><circle cx="122" cy="82" r="5" fill="#cfd6dc" stroke="none"/><path d="M122 82 v-5" stroke="#2b2b3a"/></g>
      </g>
    </svg>
  </div>
</div>

<!-- ============ İçerik ============ -->
<main class="wrap">
  <article class="card">

    <header class="hero">
      <svg class="crane" viewBox="0 0 400 290" role="img" aria-label="Vinç, 2 rakamını yukarı çekiyor">
        <g stroke="#2b2b3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M10 281H390" fill="none"/>
          <rect x="98" y="276" width="64" height="5" fill="#d9b382"/>
          <rect x="294" y="268" width="44" height="13" rx="2" fill="#6d7480"/>

          <!-- kule -->
          <rect x="306" y="48" width="18" height="220" fill="#f0b84a"/>
          <path d="M306 268L324 248L306 228L324 208L306 188L324 168L306 148L324 128L306 108L324 88L306 68L324 48" fill="none" stroke-width="2"/>

          <!-- kol + karşı ağırlık -->
          <rect x="40" y="36" width="332" height="12" fill="#f0b84a"/>
          <path d="M40 48L56 36L72 48L88 36L104 48L120 36L136 48L152 36L168 48L184 36L200 48L216 36L232 48L248 36L264 48L280 36L296 48L312 36L328 48" fill="none" stroke-width="2"/>
          <rect x="346" y="48" width="24" height="24" fill="#6d7480"/>
          <rect x="284" y="48" width="20" height="18" fill="#e6a23a"/>
          <rect x="289" y="52" width="9" height="8" fill="#dff1f2" stroke-width="1.6"/>
          <path d="M308 36L315 14L322 36" fill="#f0b84a"/>
          <path d="M315 14L70 36M315 14L366 36" fill="none" stroke-width="1.5"/>
          <path d="M315 14V4L327 8L315 11" fill="#c8423d" stroke-width="1.6"/>
          <rect x="122" y="48" width="16" height="8" rx="2" fill="#6d7480"/>

          <!-- sallanan halat, kanca ve 2 -->
          <g class="swing">
            <line class="cable" x1="130" y1="56" x2="130" y2="116" stroke-width="2"/>
            <g class="lift">
              <rect x="123" y="112" width="14" height="10" rx="2" fill="#e6a23a"/>
              <circle cx="130" cy="128" r="5" fill="none" stroke-width="3"/>
              <path d="M130 132L106 150M130 132L154 150" fill="none" stroke-width="2"/>
              <text x="130" y="208" text-anchor="middle" font-family="Fredoka, 'Baloo 2', sans-serif" font-weight="700" font-size="96" fill="#f0b84a" stroke="#2b2b3a" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2</text>
            </g>
          </g>

          <!-- parıltılar -->
          <g fill="#fff3b0" stroke-width="1.5">
            <path class="spark s1" d="M92 152l2.5-6 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5z"/>
            <path class="spark s2" d="M166 168l2-5 2 5 5 2-5 2-2 5-2-5-5-2z"/>
            <path class="spark s3" d="M96 206l2-5 2 5 5 2-5 2-2 5-2-5-5-2z"/>
          </g>
        </g>
      </svg>

      <h1 id="title">Mutlu Yıllar Can!</h1>
      <p class="lead" id="message"></p>
    </header>

    <!-- 1) Katılım formu -->
    <section id="view-form">
      <form id="rsvp" novalidate>
        <label class="field">
          <span>Adınız Soyadınız</span>
          <input type="text" name="name" maxlength="80" autocomplete="name" placeholder="Örn. Ayşe Yılmaz" required>
        </label>

        <fieldset class="choices">
          <legend>Katılabilecek misiniz?</legend>
          <label class="choice"><input type="radio" name="status" value="Geliyor"><span>🎉<b>Geliyoruz</b></span></label>
          <label class="choice"><input type="radio" name="status" value="Belki"><span>🤔<b>Belki</b></span></label>
          <label class="choice"><input type="radio" name="status" value="Gelmiyor"><span>😔<b>Gelemiyoruz</b></span></label>
        </fieldset>

        <div class="counts" id="counts" hidden>
          <div class="stepper" data-field="adults">
            <span>Yetişkin</span>
            <div><button type="button" data-d="-1" aria-label="Yetişkin sayısını azalt">−</button><output>1</output><button type="button" data-d="1" aria-label="Yetişkin sayısını artır">+</button></div>
          </div>
          <div class="stepper" data-field="kids">
            <span>Çocuk</span>
            <div><button type="button" data-d="-1" aria-label="Çocuk sayısını azalt">−</button><output>0</output><button type="button" data-d="1" aria-label="Çocuk sayısını artır">+</button></div>
          </div>
        </div>

        <label class="field">
          <span>Notunuz <em>(isteğe bağlı: alerji, mama sandalyesi vb.)</em></span>
          <textarea name="note" rows="3" maxlength="400"></textarea>
        </label>

        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <p class="err" id="err" role="alert"></p>
        <button type="submit" class="btn" id="submitBtn">Yanıtı Gönder</button>
      </form>
    </section>

    <!-- 2) Teşekkür + takvim -->
    <section id="view-thanks" hidden>
      <h2 id="thanksTitle"></h2>
      <p id="thanksText" class="lead"></p>

      <div id="calBox" class="calbox">
        <p class="cal-head">Takvime ekleyin <small>(yer ve konum etkinliğin içinde)</small></p>
        <a class="btn alt" id="calGoogle" target="_blank" rel="noopener">📅 Google Takvim</a>
        <button type="button" class="btn alt" id="calIcs">🍎 Apple Takvim / diğerleri (.ics)</button>
        <a class="btn alt" id="calOutlook" target="_blank" rel="noopener">📧 Outlook Takvim</a>
        <a class="btn alt" id="mapBtn" target="_blank" rel="noopener">📍 Haritada aç</a>
      </div>

      <button type="button" class="textbtn" id="editBtn">Yanıtımı değiştirmek istiyorum</button>
    </section>

  </article>
</main>

<footer class="eventnote" id="eventnote"></footer>

<noscript><p style="position:relative;z-index:9;text-align:center">Davetiyenin çalışması için JavaScript gerekir.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
